apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: log-node-agent
    app.kubernetes.io/instance: log-node-agent
    app.kubernetes.io/managed-by: cluster-logging-operator
    app.kubernetes.io/name: log-node-agent
    app.kubernetes.io/part-of: cluster-logging
    app.kubernetes.io/version: 6.4.0
    vector.dev/exclude: "true"
  name: log-node-agent
  namespace: openshift-logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: log-node-agent
      app.kubernetes.io/instance: log-node-agent
      app.kubernetes.io/managed-by: cluster-logging-operator
      app.kubernetes.io/name: log-node-agent
      app.kubernetes.io/part-of: cluster-logging
  template:
    metadata:
      annotations:
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        app.kubernetes.io/component: log-node-agent
        app.kubernetes.io/instance: log-node-agent
        app.kubernetes.io/managed-by: cluster-logging-operator
        app.kubernetes.io/name: log-node-agent
        app.kubernetes.io/part-of: cluster-logging
        app.kubernetes.io/version: 6.4.0
        vector.dev/exclude: "true"
    spec:
      containers:
      - args:
        - --src-path=/var/log/pods
        - --dest-path=/var/lib/openshift-logging/
        - --exclude-namespace=openshift-logging
        command:
        - /usr/bin/log-node-agent
        env:
        - name: LOG_LEVEL
          value: "3"
        image: image-registry.openshift-image-registry.svc:5000/openshift/origin-cluster-logging-operator:symlink_service
        imagePullPolicy: Always
        name: agent
        resources:
          limits:
            cpu: "2"
            memory: 500Mi
          requests:
            cpu: 500m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - NET_BIND_SERVICE
            - SETGID
            - SETPCAP
            - SETUID
          readOnlyRootFilesystem: true
          seLinuxOptions:
            type: spc_t
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/log/pods
          name: varlogpods
          readOnly: true
        - mountPath: /var/lib/openshift-logging/logs
          name: varlib
          readOnly: false
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
        foo: bar
      priorityClassName: system-node-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: mine
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/disk-pressure
        operator: Exists
      volumes:
      - hostPath:
          path: /var/log/pods
          type: ""
        name: varlogpods
      - hostPath:
          path: /var/lib/openshift-logging/logs
        name: varlib
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
    type: RollingUpdate
