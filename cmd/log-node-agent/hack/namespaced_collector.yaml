apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: foo
    app.kubernetes.io/instance: lsa-instance
    app.kubernetes.io/managed-by: cluster-logging-operator
    app.kubernetes.io/name: log-symlink-agent
    app.kubernetes.io/part-of: cluster-logging
    app.kubernetes.io/version: 6.4.0
    vector.dev/exclude: "true"
  name: namespaced-collector
  namespace: openshift-logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: foo
      app.kubernetes.io/instance: lsa-instance
      app.kubernetes.io/managed-by: cluster-logging-operator
      app.kubernetes.io/name: log-symlink-agent
      app.kubernetes.io/part-of: cluster-logging
  template:
    metadata:
      annotations:
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        app.kubernetes.io/component: foo
        app.kubernetes.io/instance: lsa-instance
        app.kubernetes.io/managed-by: cluster-logging-operator
        app.kubernetes.io/name: log-symlink-agent
        app.kubernetes.io/part-of: cluster-logging
        app.kubernetes.io/version: 6.4.0
        vector.dev/exclude: "true"
    spec:
      containers:
      - args:
        - -c
        - sleep 3600
        command:
          - sh
        env:
        - name: LOG_LEVEL
          value: "3"
        image: image-registry.openshift-image-registry.svc:5000/openshift/origin-cluster-logging-operator:symlink_service
        imagePullPolicy: Always
        name: agent
        resources:
          limits:
            cpu: "2"
            memory: 500Mi
          requests:
            cpu: 500m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - NET_BIND_SERVICE
            - SETGID
            - SETPCAP
            - SETUID
          readOnlyRootFilesystem: true
          seLinuxOptions:
            type: spc_t
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/log/pods
          name: varlib
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
        foo: bar
      priorityClassName: system-node-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: mine
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/disk-pressure
        operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/openshift-logging/logs/openshift-ovn-kubernetes
        name: varlib
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
    type: RollingUpdate
