apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: logforwarder
    app.kubernetes.io/instance: alogforwarder
    app.kubernetes.io/managed-by: cluster-logging-operator
    app.kubernetes.io/name: cluster-log-distributor
    app.kubernetes.io/part-of: cluster-logging
    app.kubernetes.io/version: 6.4.0
    vector.dev/exclude: "true"
  name: alogforwarder
  namespace: openshift-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: logforwarder
      app.kubernetes.io/instance: alogforwarder
      app.kubernetes.io/managed-by: cluster-logging-operator
      app.kubernetes.io/name: cluster-log-distributor
      app.kubernetes.io/part-of: cluster-logging
      app.kubernetes.io/version: 6.4.0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: logforwarder
        app.kubernetes.io/instance: alogforwarder
        app.kubernetes.io/managed-by: cluster-logging-operator
        app.kubernetes.io/name: cluster-log-distributor
        app.kubernetes.io/part-of: cluster-logging
        app.kubernetes.io/version: 6.4.0
        vector.dev/exclude: "true"
    spec:
      containers:
      - args:
        - --config-toml=/etc/vector/vector.toml
        - --watch-config-method=poll
        - --watch-config-poll-interval-seconds=10
        - --allow-empty-config
        command:
        - /usr/bin/vector
        env:
        - name: COLLECTOR_CONF_HASH
          value: 4aebfe0fac33bb2b014850f483a0189f
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NODE_IPV4
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: OPENSHIFT_CLUSTER_ID
          value: 37cc07a2-ce43-46c6-8e5b-c54b378c5e94
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        - name: TRUSTED_CA_HASH
          value: 867df30db0268af97a2c0485e934076d
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: quay.io/jcantril/vector:vector_components
        imagePullPolicy: Always
        name: distributor
        ports:
        - containerPort: 24231
          name: metrics
          protocol: TCP
        resources:
          limits:
            cpu: "6"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - NET_BIND_SERVICE
            - SETGID
            - SETPCAP
            - SETUID
          readOnlyRootFilesystem: true
          seLinuxOptions:
            type: spc_t
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/pki/ca-trust/extracted/pem/
          name: trusted-ca
          readOnly: true
        - mountPath: /etc/vector
          name: config
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
        foo: bar
      priorityClassName: system-node-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: mine
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/disk-pressure
        operator: Exists
      volumes:
      - emptyDir:
          medium: Memory
        name: tmp
      - configMap:
          defaultMode: 420
          items:
          - key: ca-bundle.crt
            path: tls-ca-bundle.pem
          name: mine-trustbundle
        name: trusted-ca
      - configMap:
          defaultMode: 420
          name: alogforwarder-config
        name: config
