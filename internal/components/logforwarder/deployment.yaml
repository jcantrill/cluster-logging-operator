apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: logforwarder
    app.kubernetes.io/instance: alogforwarder
    app.kubernetes.io/managed-by: cluster-logging-operator
    app.kubernetes.io/name: cluster-log-distributor
    app.kubernetes.io/part-of: cluster-logging
    app.kubernetes.io/version: 6.4.0
    vector.dev/exclude: "true"
  name: alogforwarder
  namespace: openshift-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: logforwarder
      app.kubernetes.io/instance: alogforwarder
      app.kubernetes.io/managed-by: cluster-logging-operator
      app.kubernetes.io/name: cluster-log-distributor
      app.kubernetes.io/part-of: cluster-logging
      app.kubernetes.io/version: 6.4.0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: logforwarder
        app.kubernetes.io/instance: alogforwarder
        app.kubernetes.io/managed-by: cluster-logging-operator
        app.kubernetes.io/name: cluster-log-distributor
        app.kubernetes.io/part-of: cluster-logging
        app.kubernetes.io/version: 6.4.0
        vector.dev/exclude: "true"
    spec:
      containers:
      - args:
        - --config-toml=/etc/vector/vector.toml
        - --watch-config-method=poll
        - --watch-config-poll-interval-seconds=10
        - --allow-empty-config
        command:
        - /usr/bin/vector
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NODE_IPV4
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_IPS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIPs
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: quay.io/jcantril/vector:vector_components
        imagePullPolicy: Always
        name: distributor
        ports:
        - containerPort: 24231
          name: metrics
          protocol: TCP
        - containerPort: 6000
          name: forward-logs
          protocol: TCP
        resources:
          limits:
            cpu: "6"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/pki/ca-trust/extracted/pem/
          name: trusted-ca
          readOnly: true
        - mountPath: /etc/vector
          name: config
          readOnly: true
        - mountPath: /etc/collector/metrics
          name: metrics
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccountName: default
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: service-ca.crt
            path: tls-ca-bundle.pem
          name: openshift-service-ca.crt
        name: trusted-ca
      - configMap:
          defaultMode: 420
          name: alogforwarder-config
        name: config
      - secret:
          secretName: alogforwarder-config
        name: metrics
