---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
    - "v1"
    name: mutatingpods.logging.observability.openshift.io
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /mutate-v1-pods
    failurePolicy: Fail
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations:
        - CREATE
        - UPDATE
        scope: Namespaced
    sideEffects: None